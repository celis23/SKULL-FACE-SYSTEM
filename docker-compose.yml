name: skullface

services:
  db:
    image: mysql:8.0
    container_name: skullface-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Sin 'ports': la base solo es visible dentro de la red del compose.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    container_name: skullface-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RECEPCION_USER: ${RECEPCION_USER}
      RECEPCION_PASSWORD: ${RECEPCION_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
    depends_on:
      db:
        condition: service_healthy
    # Sin 'ports': solo se llega a la API a través del nginx del frontend.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: skullface-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Escucha solo en 127.0.0.1: quien publica el sitio es el Caddy del servidor,
    # que hace proxy hacia este puerto. Nunca exponer 0.0.0.0 con el firewall inactivo.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8000}:80"

volumes:
  mysql_data:

# Red propia y aislada: la app no comparte red con software-conductual_default.
# El Caddy del servidor no necesita entrar aquí, alcanza el frontend por 127.0.0.1.
networks:
  default:
    name: skullface_default
